name: Build

# One image per server folder: ghcr.io/<owner>/<server>:latest and :<sha>.
# Add a server by adding its folder name to the matrix.
# Pull requests build the image without publishing it, so main always builds.

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  pull_request:
    paths-ignore: [ "**.md", "LICENSE" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        server: [ mcpshared ]
    steps:
      - uses: actions/checkout@v4

      - name: Server code compiles
        run: python3 -m py_compile common.py ${{ matrix.server }}/*.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.server }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', github.repository_owner, matrix.server) || '' }}

      - name: Smoke test (pull requests)
        # Root-owned data folder, as Docker creates it: the entrypoint must fix it and drop to 1000.
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/share /tmp/data && sudo chown root:root /tmp/data
          docker run -d --name smoke -p 5001:5001 -e MCP_TOKEN=smoketest-token-0123456789 \
            -v /tmp/share:/share -v /tmp/data:/data ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:latest
          for i in $(seq 30); do curl -fs localhost:5001/healthz && break; sleep 1; done
          curl -fs localhost:5001/healthz
          test "$(stat -c %u /tmp/data)" = 1000
          test "$(docker top smoke -eo pid,uid,args | awk '/server.py/ {print $2}')" = 1000
          docker exec smoke sh -c 'command -v 7zz tesseract soffice'
          docker logs smoke

  zipper-sync:
    # mcpshared/zipper.py is a copy of the engine in therepos/skills; warn when they differ.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://raw.githubusercontent.com/therepos/skills/main/zipper/scripts/zipper.py -o /tmp/upstream.py
          diff -q /tmp/upstream.py mcpshared/zipper.py \
            || echo "::warning::mcpshared/zipper.py differs from therepos/skills; re-copy it"
