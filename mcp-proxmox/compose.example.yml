# mcp-proxmox: expose one folder to Claude (claude.ai, Desktop, Code) or any MCP client.
#
# 1. Token:   openssl rand -hex 32
# 2. Expose:  Cloudflare Tunnel public hostname -> http://<docker-host-ip>:5001
# 3. Connect: claude.ai -> Settings -> Connectors -> Add custom connector
#               Name Proxmox, URL https://<hostname>/<MCP_TOKEN>/mcp  (OAuth fields empty)
#    claude.ai shows the favicon served at https://<hostname>/favicon.ico as the connector icon.

services:
  mcp-proxmox:
    image: ghcr.io/therepos/mcp-proxmox:latest
    container_name: mcp-proxmox
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - MCP_TOKEN=${MCP_TOKEN}                # hint: random, 32+ chars
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL}      # hint: e.g. https://files.example.com
      - MCP_PRIVATE_URL=${MCP_PRIVATE_URL}    # hint: e.g. http://<docker-host-ip>:5001
      - MCP_READ_ONLY=0                       # 1 = read-only share
      - MCP_TITLE=Proxmox                     # display name shown by MCP clients
      - PUID=1000                             # owner of new files in the shared folder
      - PGID=1000
    volumes:
      - /srv/shared:/share                    # the folder Claude may see
      - /srv/mcp-proxmox/data:/data           # saved settings
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
